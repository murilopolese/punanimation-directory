services:
  mongo:
    image: mongo:5
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    ports:
      - 27017:27017
    networks:
      - panimation-network
    volumes:
      - ./db:/data/db
      - ./dump:/dump
  app:
    build: .
    depends_on:
      - mongo
    restart: unless-stopped
    ports:
      - 3000:3000
    networks:
      - panimation-network
    environment:
      - COOKIE_SECRET=xxx123
      - MONGO_URL=mongodb://root:root@mongo:27017
networks:
  panimation-network:
    driver: bridge
